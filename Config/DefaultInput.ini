[/Script/Engine.InputSettings]
; Никакого сглаживания и акселерации мыши - сырые counts, как в CS.
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
; Отключает скрытые множители 2.5/-2.5 в AddControllerYaw/PitchInput:
; одна единица ввода = один градус. Чувствительность считает PBLCharacter.
bEnableLegacyInputScales=False
bAlwaysShowTouchInterface=False
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/Engine.PlayerInput]
; Убираем движковые F1-F5 (viewmode wireframe/unlit/...): в игре они только мешают.
-DebugExecBindings=(Key=F1,Command="viewmode wireframe", bIgnoreShift=True)
-DebugExecBindings=(Key=F2,Command="viewmode unlit")
-DebugExecBindings=(Key=F3,Command="viewmode lit")
-DebugExecBindings=(Key=F4,Command="viewmode lit_detaillighting")
-DebugExecBindings=(Key=F5,Command="viewmode shadercomplexity")
